name: Deprecation Sub-issue

# When an issue is opened from the Deprecation template (or labeled
# `deprecation` later), open a sub-issue for adding the warning and attach it
# to the parent. The sub-issue closes when the PR adding the warning merges
# with "Closes #<sub-issue>"; the parent stays open for a removal milestone.
#
# When the parent closes, close any of its sub-issues still open. The sub-issue
# is opened by github-actions, so a parent author without triage access cannot
# close it themselves, e.g. after withdrawing the request as not planned.

on:
  issues:
    types: [opened, labeled, closed]

permissions:
  issues: write

concurrency:
  group: deprecation-subissue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  create-warning-subissue:
    name: Create warning sub-issue
    runs-on: ubuntu-latest
    if: >-
      (github.event.action == 'opened'
        && contains(github.event.issue.labels.*.name, 'deprecation'))
      || (github.event.action == 'labeled'
        && github.event.label.name == 'deprecation')
    steps:
      - name: Create and attach the sub-issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PARENT: ${{ github.event.issue.number }}
          PARENT_TITLE: ${{ github.event.issue.title }}
          AUTHOR: ${{ github.event.issue.user.login }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # `opened` and `labeled` both fire for a new issue from the form, so
          # skip a parent that already has a sub-issue.
          existing=$(gh api "repos/$REPO/issues/$PARENT/sub_issues" --jq length)
          if [ "$existing" -gt 0 ]; then
            echo "#$PARENT already has $existing sub-issue(s); nothing to do."
            exit 0
          fi

          subject="${PARENT_TITLE#\[DEPR\] }"
          decorators="https://github.com/$REPO/blob/$DEFAULT_BRANCH/chainladder/_config/deprecation.py"
          body=$(cat <<EOF
          Add the deprecation warning for #$PARENT (created by @$AUTHOR).

          - [ ] Add the new, alternative feature (unless doing a pure deprecation)
          - [ ] Emit the warning, through one of the decorators in [\`chainladder/_config/deprecation.py\`]($decorators) where one fits
          - [ ] Test that it warns (\`pytest.warns\`)

          > [!NOTE]
          > This issue can be closed manually by closing the parent issue.

          EOF
          )

          child_url=$(gh issue create --repo "$REPO" \
            --title "[DEPR] Add warning: $subject" \
            --label deprecation \
            --body "$body")

          # The sub-issues API takes the issue's database id, not its number.
          child_id=$(gh api "repos/$REPO/issues/${child_url##*/}" --jq .id)
          gh api --method POST "repos/$REPO/issues/$PARENT/sub_issues" \
            -F sub_issue_id="$child_id"
          echo "Attached $child_url to #$PARENT."

          # Append the note to the bottom of the parent's body. Each Markdown
          # line is one shell line, as issues render every newline as a break.
          parent_body=$(gh issue view "$PARENT" --repo "$REPO" --json body --jq .body)
          note="> [!NOTE]
          > This issue tracks the deprecation as a whole and stays open until the deprecated API is removed. The warning is tracked in sub-issue #${child_url##*/}; close it by linking it from the PR that adds the warning. The removal release is set later with a milestone."
          gh issue edit "$PARENT" --repo "$REPO" --body "$parent_body

          $note"

  close-subissues:
    name: Close sub-issues with the parent
    runs-on: ubuntu-latest
    if: >-
      github.event.action == 'closed'
      && contains(github.event.issue.labels.*.name, 'deprecation')
    steps:
      - name: Close open sub-issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PARENT: ${{ github.event.issue.number }}
          PARENT_REASON: ${{ github.event.issue.state_reason }}
        run: |
          # Mirror a completed parent; anything else (not planned, duplicate)
          # means the warning will not be added either.
          if [ "$PARENT_REASON" = "completed" ]; then
            reason=completed
          else
            reason=not_planned
          fi

          open_subs=$(gh api --paginate "repos/$REPO/issues/$PARENT/sub_issues" \
            --jq '.[] | select(.state == "open") | .number')
          if [ -z "$open_subs" ]; then
            echo "#$PARENT has no open sub-issues; nothing to do."
            exit 0
          fi

          for sub in $open_subs; do
            gh api --method PATCH "repos/$REPO/issues/$sub" \
              -f state=closed -f state_reason="$reason" --silent
            gh issue comment "$sub" --repo "$REPO" \
              --body "Closed as ${reason/_/ } along with parent #$PARENT."
            echo "Closed #$sub as ${reason/_/ }."
          done
