name: Ruff

permissions:
  contents: read

on:
  push:
    branches:
      - '**'

  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine changed Python files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.event.pull_request.base.ref }}"
          else
            base="${{ github.event.before }}"
            # New branch or force-push: 'before' may not exist locally (or be all-zeros).
            if ! git cat-file -e "$base" 2>/dev/null; then
              base="HEAD^"
              git cat-file -e "$base" 2>/dev/null || base=""
            fi
          fi

          if [ -z "$base" ]; then
            files=$(git ls-files '*.py' | xargs)
          else
            files=$(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- '*.py' | xargs)
          fi

          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Install ruff
        if: steps.changed.outputs.files != ''
        run: pip install ruff==0.16.1

      - name: Run ruff
        if: steps.changed.outputs.files != ''
        run: |
          # Edited/changed files must clear the full rule set, not just the
          # subset not already grandfathered in pyproject.toml's per-file-ignores.
          # Invoked directly (not via astral-sh/ruff-action) because that action
          # both emits native ::error:: annotations AND registers a problem
          # matcher that re-scans the same output, doubling every annotation.
          ruff check --config lint.per-file-ignores={} --output-format=github ${{ steps.changed.outputs.files }}
