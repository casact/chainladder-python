name: Ruff

permissions:
  contents: read

on:
  push:
    branches:
      - '**'

  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine changed Python files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.event.pull_request.base.ref }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # origin/main already reflects this push after checkout, so diffing
            # against it here would always be empty. Use the pre-push state instead.
            base="${{ github.event.before }}"
            # New branch or force-push: 'before' may not exist locally (or be all-zeros).
            if ! git cat-file -e "$base" 2>/dev/null; then
              base="HEAD^"
              git cat-file -e "$base" 2>/dev/null || base=""
            fi
          else
            base="origin/main"
          fi

          # Base ref not fetched/available for some reason: fall back to checking everything.
          if [ -n "$base" ] && ! git cat-file -e "$base" 2>/dev/null; then
            base=""
          fi

          if [ -z "$base" ]; then
            files=$(git ls-files '*.py' | xargs)
          else
            files=$(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- '*.py' | xargs)
          fi

          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Install uv
        if: steps.changed.outputs.files != ''
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Run ruff
        if: steps.changed.outputs.files != ''
        run: |
          uvx ruff@0.16.1 check --config lint.per-file-ignores={} --output-format=github ${{ steps.changed.outputs.files }}
