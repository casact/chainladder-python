name: Ruff

permissions:
  contents: read

on:
  push:
    branches:
      - '**'

  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "latest"

      - name: Run ruff
        run: |
          uvx ruff@0.16.1 check --force-exclude --output-format=github .

      - name: Run ruff format
        run: |
          uvx ruff@0.16.1 format --check --diff --force-exclude .

      - name: Suggest import sorting and flag long lines in changed files
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}"...HEAD -- "*.py" "*.ipynb")
          if [ -z "$files" ]; then
            echo "No changed Python files or notebooks to check"
          else
            uvx ruff@0.16.1 check --force-exclude --select I,E501 --exit-zero $files
          fi
