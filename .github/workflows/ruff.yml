name: Ruff

permissions:
  contents: read

on:
  push:
    branches:
      - '**'

  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine changed Python files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.event.pull_request.base.ref }}"
          else
            base="${{ github.event.before }}"
            # New branch or force-push: 'before' may not exist locally (or be all-zeros).
            if ! git cat-file -e "$base" 2>/dev/null; then
              base="HEAD^"
              git cat-file -e "$base" 2>/dev/null || base=""
            fi
          fi

          # ruff-action splits both `args` and `src` on a literal space, not
          # newlines, so the file list must be space-joined on one line.
          if [ -z "$base" ]; then
            files=$(git ls-files '*.py' | xargs)
          else
            files=$(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- '*.py' | xargs)
          fi

          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Run ruff
        if: steps.changed.outputs.files != ''
        uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3.6.1
        with:
          version: "0.16.1"
          # Edited/changed files must clear the full rule set, not just the
          # subset not already grandfathered in pyproject.toml's per-file-ignores.
          args: check --config lint.per-file-ignores={}
          src: ${{ steps.changed.outputs.files }}
