name: docs-preview

# Builds the documentation for several versions into one site, so the version
# switcher can be reviewed with links that actually resolve.
#
# On a pull request the site is uploaded as an artifact: download it, unzip it,
# and serve the folder (`python -m http.server`) to click through it. Serving
# over HTTP is required, since the switcher fetches switcher.json, which
# browsers block from file:// URLs.
#
# The `pages` job publishes the same site to GitHub Pages. It is gated behind a
# manual run so that opening a pull request never publishes anything.

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/scripts/build_versioned_docs.py"
      - ".github/workflows/docs-preview.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built site to GitHub Pages"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Version builds check out tags, so the full history is needed.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build every version
        run: |
          uv run --extra docs python .github/scripts/build_versioned_docs.py \
            --output docs/_build/versions \
            --version HEAD:dev \
            --all-tags \
            --minor-only \
            --jobs 4 \
            --base-url "${{ inputs.publish && format('/{0}', github.event.repository.name) || '' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: docs/_build/versions
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        if: inputs.publish
        with:
          path: docs/_build/versions

  pages:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
