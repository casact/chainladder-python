default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: bash -c '
          uv run ruff check --force-exclude . &&
          uv run ruff format --check --diff --force-exclude .'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: doctest
        name: doctest
        entry: bash -c 'uv run --directory docs sphinx-autogen -o library/generated library/api.md && 
          uv run --directory docs jb build . --builder=custom --custom-builder=doctest'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
