default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: bash -c '
          base=$(git rev-parse --verify --quiet origin/main || git rev-parse --verify --quiet main) &&
          files=$(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- "*.py" "*.ipynb") &&
          if [ -z "$files" ]; then
            echo "ruff - no changed files to check";
          else
            uv run ruff check --force-exclude --config lint.per-file-ignores={} $files;
          fi'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: doctest
        name: doctest
        entry: bash -c 'uv run --directory docs sphinx-autogen -o library/generated library/api.md && 
          uv run --directory docs jb build . --builder=custom --custom-builder=doctest'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
