default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--config, "lint.per-file-ignores={}"]
        stages: [pre-push]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: doctest
        name: doctest
        entry: bash -c 'uv run --directory docs sphinx-autogen -o library/generated library/api.md && 
          uv run --directory docs jb build . --builder=custom --custom-builder=doctest'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
