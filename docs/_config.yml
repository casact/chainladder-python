# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: Chainladder - Python
author: John Bogaardt, Kenneth Hsu, et. al.
logo: images/logo.png

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: force

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - library/references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/casact/chainladder-python  # Online location of your book
  path_to_book: docs  # Optional path to your book, relative to the repository root
  branch: master  # Which branch of the repository should be used when creating links (optional)

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_issues_button: true
  use_repository_button: true

sphinx:
  # Merge the config below into jupyter-book's generated settings rather than
  # replacing them, so html_theme_options keeps the repository and launch
  # buttons jupyter-book derives from the sections above.
  recursive_update: true
  extra_extensions:
    - sphinx.ext.autodoc
    - sphinx.ext.autosummary
    - sphinx.ext.doctest
    - sphinx.ext.linkcode
    - sphinx.ext.intersphinx
    - numpydoc
    - sphinx.ext.mathjax
  local_extensions:
    linkcode: _ext
  config:
    autosummary_generate: True
    templates_path: ['_templates']
    html_static_path: ['_static']
    html_css_files: ['custom.css']
    html_theme_options:
      # Put the version picker in the top article header, beside the download
      # and fullscreen buttons, instead of leaving it to Read the Docs' own
      # flyout in the lower right corner.
      article_header_end:
        - version-switcher.html
        - article-header-buttons.html
      switcher:
        # Served from the stable build so every version reads one list.
        json_url: https://chainladder-python.readthedocs.io/stable/_static/switcher.json
        # version_match cannot be set here, since it comes from the
        # READTHEDOCS_VERSION environment variable. conf.py sets it.
        version_match: dev
    numpydoc_show_class_members: False
    bibtex_reference_style: author_year
    intersphinx_mapping:
      sklearn:
        - https://scikit-learn.org/stable/
        - null

parse:
  myst_enable_extensions:
    - html_admonition
    - colon_fence
    - dollarmath
    - linkify
    - substitution
