[build-system]
requires = ["setuptools>=61.0", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "chainladder"
version = "0.10.0"
authors = [
    {name = "John Bogaardt", email = "jbogaardt@gmail.com"},
]
maintainers = [
    {name = "John Bogaardt", email = "jbogaardt@gmail.com"},
]
description = "Chainladder Package - P&C Loss Reserving package"
readme = "README.rst"
license = {text = "MPL-2.0"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["actuarial", "reserving", "insurance", "chainladder", "IBNR"]
dependencies = [
    "pandas >=2.3.3, !=3.0.4",
    "scikit-learn>1.4.2",
    "sparse>=0.9",
    "numpy>=2.0",
    "matplotlib",  # Required for TriangleDisplay.heatmap()
    "dill",
    "patsy>=1.0.2",  # 1.0.1 breaks on pandas 3 default str dtype (np.issubdtype on StringDtype)
]

[project.urls]
Homepage = "https://github.com/casact/chainladder-python"
Documentation = "https://chainladder-python.readthedocs.io/"
Repository = "https://github.com/casact/chainladder-python"
"Bug Tracker" = "https://github.com/casact/chainladder-python/issues"


[project.optional-dependencies]
dev = [
    "lxml",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "jinja2",
    "ipython",
    "ipykernel",
    "pyright",
    "ruff",
    "pre-commit",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "nbsphinx",
    "numpydoc",
    "jupyter-book<2.0",  # Pin to v1.x - v2 doesn't support autodoc/autosummary yet
    "sphinx-book-theme>=1.1.4,<1.2; python_version < '3.11'",
    "sphinx-book-theme>=1.2,<1.3; python_version >= '3.11'",
    "sphinx-togglebutton",
    "ipython",
    "parso>=0.8",
    "polars",  # For docs examples
    "statsmodels>=0.14.6"  # For docs example; <0.14.6 fails to import under pandas 3
]
test = [
    "lxml",
    "nbmake",
    "pytest",
    "jinja2",
    "ipython",
    "pytest-cov",  # For coverage testing
    "polars",
    "pyarrow",
    "dask",
    'statsmodels>=0.14.6'
]
performance = [
    "dask",  # For distributed computing
    "cupy",  # For GPU acceleration (if available)
]
all = [
    "chainladder[dev,docs,test]",
]

[tool.pytest.ini_options]
testpaths = ["chainladder", "docs/_ext"]
pythonpath = ["docs/_ext"]

[tool.ruff]
target-version = "py310"
preview = true
# Fill-in-the-blank exercise notebook: contains `__fill_in_code__` placeholders
# that are not valid syntax, so ruff cannot parse it.
extend-exclude = ["docs/getting_started/online_sandbox/sandbox_workbook_blank.ipynb"]

[tool.ruff.lint]
select = ["E2", "E4", "E7", "E9", "F", "B018", "UP034", "N802"]

# Grandfathered violations that predate enabling this rule set. New and
# newly-touched code is still held to the full ruleset above; these files
# are exempted only from the specific codes they already violated so the
# check can be required without blocking unrelated PRs. Remove entries as
# files are cleaned up.
[tool.ruff.lint.per-file-ignores]
"chainladder/adjustments/bootstrap.py" = ["E231", "E721", "E722", "F841"]
"chainladder/adjustments/disposal.py" = ["E226", "E227", "E231", "E251", "E252", "E265", "F401"]
"chainladder/adjustments/tests/test_berqsherm.py" = ["F841"]
"chainladder/adjustments/tests/test_disposal.py" = ["E226", "E231", "E241", "E251", "E265", "F841"]
"chainladder/adjustments/trend.py" = ["F401"]
"chainladder/core/tests/rtest_correlation.py" = ["E266", "E722", "F821"]
"chainladder/core/tests/test_display.py" = ["E722"]
"chainladder/development/tests/rtest_clark.py" = ["E266", "E722"]
"chainladder/development/tests/rtest_development.py" = ["E266", "E722", "F401"]
"chainladder/development/tests/rtest_munich.py" = ["E266", "E722", "F401"]
"chainladder/methods/tests/rtest_mack.py" = ["E266", "E722", "F401"]
"chainladder/tails/tests/rtest_exponential.py" = ["E722", "F401"]
"docs/friedland/chapter_10.ipynb" = ["E731", "F841"]
"docs/friedland/chapter_7_part_2.ipynb" = ["N802"]
"docs/friedland/chapter_9.ipynb" = ["E731"]
"docs/getting_started/tutorials/stochastic-tutorial.ipynb" = ["E231"]
"docs/getting_started/tutorials/tail-tutorial.ipynb" = ["E722", "F401"]
"docs/user_guide/adjustments.ipynb" = ["E226", "E231", "E251"]
"docs/user_guide/development.ipynb" = ["E225", "E226", "E231", "F401"]
"docs/user_guide/methods.ipynb" = ["E225", "E226", "E261"]
"docs/user_guide/tails.ipynb" = ["E226", "E231", "E251", "E703", "F541", "UP034"]
"docs/user_guide/triangle.ipynb" = ["E203", "E225", "E226", "E227", "E231"]
"docs/user_guide/workflow.ipynb" = ["E203", "E225", "E226", "E231", "E251", "E261", "E731"]

[tool.ruff.format]
docstring-code-format = true

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["chainladder", "chainladder.*"]

[tool.setuptools.package-data]
chainladder = ["utils/data/*", "py.typed"]

[tool.uv]
config-settings = {editable_mode="compat"}
