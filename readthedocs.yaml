version: 2

sphinx:
  configuration: docs/conf.py

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.11"
  jobs:
    pre_build:
      # Before conf.py is generated: the menu is a static asset, and each
      # build serves the copy it writes here.
      # SWITCHER_DEMO pads the menu with releases Read the Docs is not hosting
      # yet, so this branch's preview shows the finished shape of the feature.
      # Drop it in the branch that makes this work for real.
      - "SWITCHER_DEMO=1 python docs/generate_switcher.py"
      - "jupyter-book config sphinx docs/"
      - "python docs/prep_sphinx_conf.py"

python:
  install:
    - method: uv
      command: sync
      extras:
        - docs
